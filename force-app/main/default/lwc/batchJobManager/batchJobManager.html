<template>
    <lightning-card title={cardTitle} icon-name="standard:flow">
        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="Batch Class Name" value={batchClassName} onchange={handleBatchClassChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="Scheduler Class Name" value={schedulerClassName} onchange={handleSchedulerClassChange}></lightning-input>
                </div>
            </div>

            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="CRON Expression" value={cronExpression} onchange={handleCronChange}></lightning-input>
                </div>
            </div>

            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    <div>
                        <span class="slds-text-heading_small slds-m-right_small">Scheduler status:</span>
                        <template if:true={jobStatus.isScheduled}>
                            <lightning-badge label="Planned" class="slds-theme_success"></lightning-badge>
                        </template>
                        <template if:false={jobStatus.isScheduled}>
                            <lightning-badge label="Not active" class="slds-theme_error"></lightning-badge>
                        </template>
                    </div>
                    <lightning-button-icon icon-name="utility:refresh" onclick={fetchJobStatus} alternative-text="Refresh"></lightning-button-icon>
                </div>

                <template if:true={jobStatus.isScheduled}>
                    <div class="slds-m-top_small slds-grid slds-gutters">
                        <div class="slds-col">
                            <p class="slds-text-title">Next launch:</p>
                            <p><strong>{formattedNextFireTime}</strong></p>
                        </div>
                        <div class="slds-col">
                            <p class="slds-text-title">Previous launch</p>
                            <p><strong>{formattedPreviousFireTime}</strong></p>
                        </div>
                    </div>
                </template>

                <hr class="slds-m-vertical_small" />

                <div>
                    <p class="slds-text-title">The last Batch execution:</p>
                    <p>Status: <strong>{jobStatus.lastBatchStatus}</strong> | Processed items: <strong>{jobStatus.lastBatchItemsProcessed}/{jobStatus.lastBatchTotalItems}</strong> | Errors: <strong>{jobStatus.lastBatchErrors}</strong></p>
                </div>
            </div>

            <div class="slds-grid slds-grid_align-center slds-gutters">
                <div class="slds-col">
                    <lightning-button label="Run once" variant="brand-outline" icon-name="utility:play" onclick={handleRunOnce}></lightning-button>
                </div>
                <div class="slds-col">
                    <template if:false={jobStatus.isScheduled}>
                        <lightning-button label="Schedule batch" variant="brand" icon-name="utility:event" onclick={handleSchedule}></lightning-button>
                    </template>
                    <template if:true={jobStatus.isScheduled}>
                        <lightning-button label="Abort Batch" variant="destructive" icon-name="utility:stop" onclick={handleAbort}></lightning-button>
                    </template>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
